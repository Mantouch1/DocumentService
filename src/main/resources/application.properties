spring.application.name=document-service
server.port=8085

# --- Database (password: SPRING_DATASOURCE_PASSWORD) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/document_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT (same secret as IdentityService, required) ---
app.jwt.secret=${JWT_SECRET}

# --- File storage ---
app.storage.dir=${STORAGE_DIR:./data/files}
app.storage.allowed-extensions=pdf,doc,docx,xls,xlsx,png,jpg,jpeg,txt
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Other services (Feign) ---
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8082}
tenderflow.service.url=${TENDERFLOW_SERVICE_URL:http://localhost:8081}
report.service.url=${REPORT_SERVICE_URL:http://localhost:8086}
app.tender-check.enabled=${TENDER_CHECK_ENABLED:true}
app.audit.enabled=${AUDIT_ENABLED:true}
app.service-account.email=${SERVICE_ACCOUNT_EMAIL:}
app.service-account.password=${SERVICE_ACCOUNT_PASSWORD:}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
