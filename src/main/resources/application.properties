
# === Application ===
spring.application.name=DocumentService

# === Server Port ===
server.port=8085

# === PostgreSQL Database Configuration ===
# Local: localhost:5435
# Docker: document-postgres:5432

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/document_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === JWT Configuration ===
# MUST be identical to IdentityService JWT secret
# Local development default only
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_THE_SAME_SECRET_AS_IDENTITY_SERVICE}

# === File Storage ===
app.storage.dir=${STORAGE_DIR:./data/files}
app.storage.allowed-extensions=pdf,doc,docx,xls,xlsx,png,jpg,jpeg,txt

# === Multipart Configuration ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# === Other Microservices (Feign) ===

identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8082}
tenderflow.service.url=${TENDERFLOW_SERVICE_URL:http://localhost:8081}
report.service.url=${REPORT_SERVICE_URL:http://localhost:8086}

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.default.logger-level=basic

logging.level.com.document.client=DEBUG

# === Business Configuration ===
app.tender-check.enabled=${TENDER_CHECK_ENABLED:true}
app.audit.enabled=${AUDIT_ENABLED:true}

# === Technical Account for Microservices ===
app.service-account.email=${SERVICE_ACCOUNT_EMAIL:}
app.service-account.password=${SERVICE_ACCOUNT_PASSWORD:}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
